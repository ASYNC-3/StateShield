upstream:
  provider: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini

judge:
  provider: groq
  model: llama-3.3-70b-versatile
  api_key_env: GROQ_API_KEY

thresholds:
  tier1_block: 0.85
  tier1_escalate: 0.55
  trust_lockdown: 30

storage:
  path: .guardrail/store
